plugins {
    id 'com.android.application'
}

android {
    namespace 'com.akm.pagenotes'
    compileSdk 34

    defaultConfig {
        applicationId "com.akm.pagenotes"
        minSdk 23
        targetSdk 34
        versionCode 15
        versionName "2.13"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
