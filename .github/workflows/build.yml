name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7 (with retry and mirrors)
        run: |
          for u in \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            https://downloads.gradle.org/distributions/gradle-8.7-bin.zip \
            https://mirrors.cloud.tencent.com/gradle/gradle-8.7-bin.zip; do
            for i in 1 2 3; do
              if curl -fsSL --retry 3 -o /tmp/gradle.zip "$u"; then break 2; fi
              sleep 5
            done
          done
          test -s /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PageNotes-APK
          path: app/build/outputs/apk/debug/app-debug.apk
